<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deals Preview - GitHub Pages</title>
    <style>
      body { margin: 0; font-family: Arial, "Noto Sans TC", sans-serif; background: #f4f7fc; color: #0f233c; }
      .phone { max-width: 390px; margin: 0 auto; min-height: 100vh; background: #f4f7fc; }
      .logo { background: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: #0088da; font-size: 30px; position: sticky; top: 0; z-index: 9; }
      .logo small { color: #4f6074; font-size: 24px; }
      .filter { background: #fff; position: sticky; top: 56px; z-index: 8; display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #e6edf7; overflow-x: auto; }
      .chip { background: #f0f4fa; border-radius: 18px; font-size: 12px; font-weight: 700; padding: 8px 12px; white-space: nowrap; }
      .chip.active { background: #e6f3ff; color: #0575e6; }
      .new { background: #ff4d4f; color: #fff; border-radius: 10px; font-size: 9px; padding: 1px 5px; margin-left: 4px; }
      .sec { padding: 12px 16px; }
      .hero { height: 172px; border-radius: 14px; padding: 12px; color: #fff; font-weight: 800; display: flex; align-items: flex-end; background: linear-gradient(120deg, #1554a7, #59a7ff); }
      .icons { background: #fff; border-radius: 14px; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; padding: 10px 8px; gap: 8px; }
      .icons .i { font-size: 24px; }
      .icons .t { font-size: 12px; color: #33475f; margin-top: 5px; }
      .search { background: #fff; border: 1px solid #d8e7f7; border-radius: 14px; display: flex; align-items: center; padding: 6px; }
      .search input { flex: 1; border: none; outline: none; font-size: 14px; }
      .btn { background: #2e9bff; color: #fff; border-radius: 16px; padding: 8px 16px; font-size: 12px; font-weight: 700; }
      h2 { margin: 0 0 10px; font-size: 26px; }
      .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 8px; }
      .left-big { background: #fff; border-radius: 12px; overflow: hidden; }
      .col { display: grid; gap: 8px; }
      .ad { height: 86px; background: #b9d6f5; }
      .ad.big { height: 180px; }
      .ad-title { background: #fff; padding: 6px 8px; font-size: 12px; font-weight: 700; }
      .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
      .scroll { display: flex; gap: 10px; overflow-x: auto; }
      .mini { min-width: 170px; background: #fff; border-radius: 12px; padding: 10px; }
      .hot { background: #fff; border-radius: 14px; overflow: hidden; }
      .img { height: 160px; background: linear-gradient(120deg, #88bcf4, #5579d2); }
      .hot .body { padding: 10px; }
      .price { color: #e63946; font-size: 34px; font-weight: 800; text-align: right; }
      .cards .card { background: #fff; border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
      .cards .cover { height: 180px; background: linear-gradient(120deg, #8dc4fb, #5f94e7); }
      .cards .body { padding: 10px; }
      .muted { color: #6f8097; font-size: 12px; }
      .foot { text-align: center; font-size: 12px; color: #7690ad; padding: 10px 0 20px; }
    </style>
  </head>
  <body>
    <main class="phone">
      <header class="logo">易飛旅遊 eTravel <small>🔔 ☰</small></header>
      <nav class="filter">
        <span class="chip active">首頁</span>
        <span class="chip">線上旅展 <span class="new">NEW</span></span>
        <span class="chip">活動主題</span>
        <span class="chip">折價券</span>
      </nav>

      <section class="sec"><div class="hero">早鳥享優惠 ✈︎ 歐洲賞楓中</div></section>
      <section class="sec">
        <div class="icons">
          <div><div class="i">🧳</div><div class="t">團體旅遊</div></div>
          <div><div class="i">🗺️</div><div class="t">自由行</div></div>
          <div><div class="i">✈️</div><div class="t">機票</div></div>
          <div><div class="i">🏨</div><div class="t">訂房</div></div>
        </div>
      </section>
      <section class="sec"><div class="search"><input placeholder="想去哪裡玩？" /><span class="btn">搜尋</span></div></section>

      <section class="sec">
        <h2>主題推薦</h2>
        <div class="grid">
          <div class="left-big"><div class="ad big"></div><div class="ad-title">東北賞楓之旅</div></div>
          <div class="col">
            <div><div class="ad"></div><div class="ad-title">海島度假專區</div></div>
            <div><div class="ad"></div><div class="ad-title">小資自由行</div></div>
          </div>
        </div>
        <div class="two">
          <div><div class="ad"></div><div class="ad-title">親子樂園假期</div></div>
          <div><div class="ad"></div><div class="ad-title">歐洲經典 10 日</div></div>
        </div>
      </section>

      <section class="sec">
        <h2>繼續搜尋</h2>
        <div class="scroll">
          <div class="mini">九州溫泉 5 天<br /><span class="muted">11 月出發</span></div>
          <div class="mini">沖繩親子自由行<br /><span class="muted">寒假限定</span></div>
          <div class="mini">首爾追雪 4 天<br /><span class="muted">跨年檔期</span></div>
        </div>
      </section>

      <section class="sec">
        <h2>熱門限定</h2>
        <div class="hot">
          <div class="img"></div>
          <div class="body">
            德奧童話城堡 9 日
            <div class="muted">原價 NT$ 39,900</div>
            <div class="price">NT$ 29,900</div>
          </div>
        </div>
      </section>

      <section class="sec cards">
        <h2>熱門行程</h2>
        <div class="card"><div class="cover"></div><div class="body">富士山河口湖・溫泉美景 5 日<div class="price">NT$ 29,900</div></div></div>
        <div class="card"><div class="cover"></div><div class="body">法瑞雙國・少女峰鐵道 10 日<div class="price">NT$ 89,900</div></div></div>
      </section>
      <div class="foot">GitHub Pages Preview</div>
    </main>
  </body>
</html>
